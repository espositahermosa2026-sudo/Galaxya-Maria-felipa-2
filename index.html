<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mamá Maria Felipa</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0718;overflow:hidden;height:100vh;width:100vw;font-family:'Poppins',sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%}
.cardWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10}
.card{background:rgba(255,255,255,0.07);backdrop-filter:blur(12px);border:1px solid rgba(255,182,193,0.35);border-radius:32px;padding:24px 20px 20px;text-align:center;max-width:360px;width:88%;box-shadow:0 10px 40px rgba(255,105,180,0.4)}
.photoWrap{position:relative;width:210px;height:210px;margin:0 auto 14px}
.photoWrap .ring{position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(#ff69b4,#ffd700,#ff9ac1,#ff69b4);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.photoWrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;z-index:2}
.flower{position:absolute;z-index:3;font-size:22px;animation:float 3s ease-in-out infinite}
.f1{top:-8px;left:-6px} .f2{top:-10px;right:-4px} .f3{bottom:0px;left:-12px} .f4{bottom:-4px;right:-8px} .f5{top:50%;left:-22px} .f6{top:50%;right:-22px}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.15)}}
h1{font-family:'Dancing Script',cursive;color:#ffb6d9;font-size:1.8rem;line-height:1.1;text-shadow:0 0 10px #ff69b4}
h1 span{color:#fff;display:block;font-size:2.2rem}
.msg{color:#ffe2f0;font-size:0.88rem;margin:12px 0;line-height:1.5;font-weight:300}
.btn{margin-top:10px;background:linear-gradient(135deg,#ff69b4,#ff1493);color:white;border:none;padding:10px 20px;border-radius:50px;cursor:pointer;font-weight:600}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:5}
.heart{position:absolute;animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(110vh) scale(0.5);opacity:1}100%{transform:translateY(-10vh) scale(1.3);opacity:0}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="hearts"></div>
<div class="cardWrap"><div class="card">
<div class="photoWrap">
<div class="ring"></div>
<img src="mama.jpg" alt="Mamá Maria Felipa">
<div class="flower f1">🌸</div><div class="flower f2">💖</div><div class="flower f3">🌹</div><div class="flower f4">🌸</div><div class="flower f5">💐</div><div class="flower f6">💝</div>
</div>
<h1>Para la Reina de mi vida <span>Maria Felipa</span></h1>
<p class="msg">Mamá, gracias por darme la vida y por enseñarme con tu ejemplo lo que es el amor verdadero. Todo lo que soy es gracias a ti. Te amo con todo mi corazón. Para la mejor mamá del mundo, gracias por tu amor infinito. Eres mi mayor orgullo.</p>
<button class="btn" id="btn">🎵 Toca para tu canción</button>
</div></div>
<audio id="audio" loop src="https://files.catbox.moe/gd8gz8.m4a"></audio>
<script>
const canvas=document.getElementById('bg'), ctx=canvas.getContext('2d'), hearts=document.getElementById('hearts'), audio=document.getElementById('audio'), btn=document.getElementById('btn');
let w,h,stars=[],t=0,playing=false;
function rs(){w=canvas.width=innerWidth;h=canvas.height=innerHeight} rs(); addEventListener('resize',rs);
for(let i=0;i<180;i++) stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+0.2,a:Math.random()});
function loop(){t+=16; ctx.fillStyle='rgba(13,7,24,0.35)'; ctx.fillRect(0,0,w,h); stars.forEach(s=>{ctx.fillStyle='#ff9ac1'; ctx.globalAlpha=0.3+s.a*0.7*Math.sin(t*0.001+s.x); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();}); requestAnimationFrame(loop)} loop();
function spawn(){const el=document.createElement('div'); el.className='heart'; el.textContent=Math.random()>0.5?'💖':'🌸'; el.style.left=Math.random()*100+'vw'; el.style.fontSize=(14+Math.random()*22)+'px'; el.style.animationDuration=(4+Math.random()*4)+'s'; hearts.appendChild(el); setTimeout(()=>el.remove(),8000);} setInterval(spawn,280);
function toggle(){if(playing){audio.pause(); playing=false; btn.textContent='🎵 Toca para tu canción';}else{audio.play().then(()=>{playing=true; btn.textContent='⏸️ Pausar';});}} btn.onclick=toggle;
document.body.addEventListener('click',e=>{if(e.target.tagName!='BUTTON' && !playing) toggle();},{once:true});
</script>
</body>
</html>
