<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mamá Maria Felipa - Mi Vida</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0612; overflow:hidden; height:100vh; width:100vw; font-family:'Poppins',sans-serif;}
canvas{position:fixed; top:0; left:0; width:100%; height:100%;}
#canvasBack{z-index:1}
#canvasFront{z-index:3; pointer-events:none;}
#ui{position:fixed; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; pointer-events:none;}
.card{pointer-events:auto; background:rgba(255,255,255,0.06); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid rgba(255,182,193,0.25); border-radius:26px; padding:22px 22px; text-align:center; max-width:340px; width:85%; box-shadow:0 8px 32px rgba(0,0,0,0.4);}
h1{font-family:'Dancing Script',cursive; font-size:1.9rem; color:#ffb6d9; text-shadow:0 0 12px #ff69b4; line-height:1.1;}
h1 span{color:#fff; display:block; font-size:2.3rem;}
.msg{color:#ffd6e8; font-size:0.88rem; line-height:1.55; margin:12px 0; font-weight:300;}
.name{font-family:'Dancing Script',cursive; font-size:1.6rem; color:#ff8ac1;}
.btn{margin-top:14px; background:linear-gradient(135deg,#ff69b4,#ff1493); color:white; border:none; padding:10px 22px; border-radius:50px; font-size:0.9rem; cursor:pointer; box-shadow:0 4px 15px rgba(255,105,180,0.5);}
</style>
</head>
<body>
<canvas id="canvasBack"></canvas>
<canvas id="canvasFront"></canvas>
<div id="ui">
<div class="card">
<h1>Para ti Mamá <span>Maria Felipa</span></h1>
<p class="msg">Mamá, tú eres mi primer amor, mi refugio y mi fuerza. Cada flor de este corazón es un gracias por tus desvelos, tus abrazos y tu amor infinito. Te amo más que a mi vida.</p>
<div class="name">Hernández Hernández 💖</div>
<button class="btn" id="btn">🎵 Toca para tu canción</button>
</div>
</div>
<audio id="audio" loop src="https://files.catbox.moe/gd8gz8.m4a" preload="auto"></audio>
<script>
const back=document.getElementById('canvasBack'), front=document.getElementById('canvasFront');
const ctxB=back.getContext('2d'), ctxF=front.getContext('2d');
const audio=document.getElementById('audio'), btn=document.getElementById('btn');
let w,h,stars=[],flowers=[],t=0, playing=false;
function rs(){w=back.width=front.width=innerWidth; h=back.height=front.height=innerHeight} rs(); addEventListener('resize',rs);
for(let i=0;i<250;i++) stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+0.2,a:Math.random()*0.6+0.2,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2});
function heart(t,s){let x=16*Math.pow(Math.sin(t),3), y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)); return {x:x*s, y:y*s}}
// flores rosas que suben formando corazón y pasan por ENFRENTE
for(let i=0;i<150;i++){
  let ang=Math.random()*Math.PI*2;
  let p=heart(ang, 12+Math.random()*5);
  flowers.push({
    x: w/2 + p.x + (Math.random()-0.5)*30,
    y: h + Math.random()*h,
    tx: w/2 + p.x,
    ty: h/2 + p.y - 40,
    size: 5+Math.random()*7,
    speed: 0.6+Math.random()*1.2,
    sway: Math.random()*2,
    layer: Math.random()>0.4 ? 'front' : 'back',
    color: Math.random()>0.3 ? '#ff4d94' : '#ff9ac1'
  });
}
function drawFlower(ctx,x,y,s,col){
  ctx.save(); ctx.translate(x,y);
  ctx.rotate(Math.sin(t*0.002+x)*0.3);
  ctx.strokeStyle='#4caf50'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(0,s*0.6); ctx.lineTo(0,s*1.8); ctx.stroke();
  ctx.fillStyle=col;
  for(let i=0;i<5;i++){ctx.rotate(Math.PI*2/5); ctx.beginPath(); ctx.ellipse(0,-s*0.5,s*0.45,s*0.7,0,0,Math.PI*2); ctx.fill();}
  ctx.fillStyle='#fff0f6'; ctx.beginPath(); ctx.arc(0,0,s*0.28,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function loop(){
  t+=16;
  ctxB.fillStyle='rgba(10,6,18,0.3)'; ctxB.fillRect(0,0,w,h);
  ctxF.clearRect(0,0,w,h);
  stars.forEach(s=>{
    s.x+=s.vx; s.y+=s.vy; if(s.x<0||s.x>w)s.vx*=-1; if(s.y<0||s.y>h)s.vy*=-1;
    ctxB.fillStyle='#ffb6d9'; ctxB.globalAlpha=s.a; ctxB.beginPath(); ctxB.arc(s.x,s.y,s.r,0,Math.PI*2); ctxB.fill();
  });
  ctxB.globalAlpha=1;
  flowers.forEach(f=>{
    f.y-=f.speed;
    f.x+=Math.sin(t*0.001*f.sway)*0.4;
    if(f.y<-50){f.y=h+50; f.x= w/2 + (Math.random()-0.5)*200;}
    // si está cerca del centro forma corazón
    if(f.y>h*0.2 && f.y<h*0.8){f.x+=(f.tx-f.x)*0.01}
    if(f.layer==='back') drawFlower(ctxB,f.x,f.y,f.size,f.color);
    else {drawFlower(ctxF,f.x,f.y,f.size,f.color); ctxF.shadowColor=f.color; ctxF.shadowBlur=8; ctxF.shadowBlur=0;}
  });
  requestAnimationFrame(loop);
} loop();
function toggle(){if(playing){audio.pause(); playing=false; btn.textContent='🎵 Toca para tu canción';}else{audio.play().then(()=>{playing=true; btn.textContent='⏸️ Pausar canción';});}} btn.onclick=toggle; document.body.addEventListener('click',e=>{if(e.target!==btn && !playing) toggle();},{once:true});
</script>
</body>
</html>
